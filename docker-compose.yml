services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: slotify-postgres
    environment:
      # Read from .env so the database and the API always use the same credentials.
      # Note: these only apply when the volume is first created. For an existing volume,
      # set DB_USER / DB_PASSWORD to match the credentials it was created with, or recreate it.
      POSTGRES_DB: ${DB_NAME:-slotify}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - slotify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-slotify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: slotify-redis
    ports:
      - "6379:6379"
    volumes:
      - slotify_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: slotify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - slotify_minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: slotify-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  slotify_pg_data:
  slotify_redis_data:
  slotify_minio_data:
